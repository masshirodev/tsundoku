# The extension engine (a fork of M-Extension-Server, masshirodev/tsundoku-engine)
# and FlareSolverr beside it for sites behind a Cloudflare challenge
# (doc/EXTENSION-ENGINE.md), for DEVELOPMENT only: a live tsundoku is the
# released bundle, whose launcher runs the bundle's own engine on 4590. This
# one is on 4591, so both can run, and keeps its APKs apart from the live ones. Start it by hand:
#   ENGINE_TOKEN=... docker compose -f ops/engine/compose.yml up -d
#
# The engine's image is built from its repository, not pulled:
#   docker build -t tsundoku-engine:local <a checkout of masshirodev/tsundoku-engine>
name: tsundoku-engine
services:
  engine:
    image: tsundoku-engine:local
    container_name: tsundoku-engine
    restart: 'no'
    # The image's entrypoint is `java -jar runner.jar 8080`; this is its
    # app directory (ts.server.rootDir), on the container's own disk.
    command: ['/tmp/app']
    user: '1000:1000'
    # localhost only. No endpoint but / works without ENGINE_TOKEN, but the
    # proxies fetch through every source's cookies, so it never binds wider.
    ports:
      - 127.0.0.1:4591:8080
    environment:
      TZ: ${TZ:-UTC}
      ENGINE_TOKEN: ${ENGINE_TOKEN:?}
      # Loaded APKs, under their handle, so a restart isn't a 409 per source.
      ENGINE_APK_DIR: /data/apks
      # Source preferences are java.util.prefs; keep them in the container.
      # tsundoku owns them and sends them with every call
      # (doc/EXTENSION-ENGINE.md, "Preferences").
      JAVA_TOOL_OPTIONS: -Djava.util.prefs.userRoot=/tmp/prefs
    volumes:
      # ENGINE_DATA's default is this deployment's own folder.
      - ${ENGINE_DATA:-/mnt/hdd2/tsundoku/engine-dev}/apks:/data/apks
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: tsundoku-flaresolverr
    restart: 'no'
    # The engine reaches it on the compose network, as http://flaresolverr:8191/v1,
    # which tsundoku sends as each call's cf-proxy-url. The app itself now solves
    # a novel plugin's check too (doc/NOVELS.md), and it runs on the
    # host, not in this network: publish the solver to 127.0.0.1 only, on 8193,
    # never 8191, which the live release's own solver holds. A dev .env sets
    # NOVEL_SOLVER_URL=http://127.0.0.1:8193/v1 for it.
    ports:
      - 127.0.0.1:8193:8191
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
