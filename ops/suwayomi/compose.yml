# Suwayomi-Server: Mihon's extensions on the JVM, downloading on the
# workstation (doc/DOWNLOADING.md). Started by ops/systemd/tsundoku-suwayomi.service,
# never by Docker on its own: that unit waits for /mnt/hdd2, and a container
# started before the mount would write the downloads onto /.
name: tsundoku-suwayomi
services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: tsundoku-suwayomi
    restart: 'no'
    # localhost only: the tailnet reaches it through `tailscale serve` on
    # https port 10000, never a wider bind (doc/DOWNLOADING.md, "On the tailnet").
    ports:
      - 127.0.0.1:4567:4567
    environment:
      TZ: America/Cuiaba
      # The login the tailnet needs, from tsundoku's .env, which sends it too.
      AUTH_MODE: BASIC_AUTH
      AUTH_USERNAME: ${SUWAYOMI_USERNAME:?}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD:?}
      DOWNLOAD_AS_CBZ: 'true'
      EXTENSION_STORES: '["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]'
      # Suwayomi's own daily backup; the timer takes one before every import too.
      BACKUP_INTERVAL: '1'
      BACKUP_TTL: '14'
    volumes:
      # Its database, settings and extensions. The order matters: the
      # mounts below sit inside this one.
      - ${SUWAYOMI_DATA:-/mnt/hdd2/tsundoku/suwayomi}:/home/suwayomi/.local/share/Tachidesk
      # Mihon's own layout, one level down, read by the importer as a device.
      - ${LIBRARY_ROOT:?}/devices/suwayomi/Mihon/downloads:/home/suwayomi/.local/share/Tachidesk/downloads/mangas
      - ${LIBRARY_ROOT:?}/devices/suwayomi/Mihon/autobackup:/home/suwayomi/.local/share/Tachidesk/backups
