<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Installable (doc/INSTALL.md): the icon is 積, typeset, not drawn. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/icons/favicon-32.png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script>
			// In the Android app the page itself cannot be scaled (doc/ANDROID.md,
			// "Zoom is off"): the WebView's setSupportZoom(false) let a pinch scale
			// every screen on the owner's phone anyway, and a viewport that pins the
			// scale to 1 holds whatever the WebView's settings do. The readers'
			// zoom is their own, drawn by the page, so it is untouched. A browser
			// keeps its pinch: there it is the reader's way to enlarge the page.
			// The token is the one catalog.ts's isTsundokuApp matches.
			if (/Tsundoku(?:TV|App)\//i.test(navigator.userAgent)) {
				document
					.querySelector('meta[name="viewport"]')
					?.setAttribute(
						'content',
						'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'
					);
			}
		</script>
		<script>
			// Waiting (doc/WAITING.md): the header's progress line fills only as a
			// screen's data actually arrives. SvelteKit keeps its own reference to
			// fetch when it starts, so the byte count is added here, before it
			// does. Only a screen's __data.json is counted, and nothing about the
			// response changes: the same bytes, passed straight through.
			(() => {
				const native = window.fetch.bind(window);
				window.fetch = async (input, init) => {
					const res = await native(input, init);
					const url =
						typeof input === 'string' ? input : input instanceof URL ? input.href : input.url;
					if (!res.body || !/\/__data\.json(\?|$)/.test(url)) return res;
					const total = Number(res.headers.get('content-length')) || 0;
					const tell = (loaded) =>
						dispatchEvent(new CustomEvent('tsundoku:bytes', { detail: { url, loaded, total } }));
					let loaded = 0;
					tell(0);
					const reader = res.body.getReader();
					const body = new ReadableStream({
						async pull(c) {
							const { done, value } = await reader.read();
							if (done) return c.close();
							loaded += value.length;
							tell(loaded);
							c.enqueue(value);
						},
						cancel: (r) => reader.cancel(r)
					});
					return new Response(body, {
						status: res.status,
						statusText: res.statusText,
						headers: res.headers
					});
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
