# Builds tsundoku's website and puts it on the server (doc/WEBSITE.md, "Deploy").
#
# Runs on a push to main that touches what the page is made of, and on
# dispatch: ops/release/publish.ts dispatches it after a release, so the
# download block shows the new version within minutes. The build reads the
# live latest.json and stops if its signature doesn't verify.
#
# The deploy key is locked on the server (authorized_keys, `restrict` and
# `command="rrsync ..."`) to writing the one folder the site is served from:
# it can't open a shell, read, or reach anything else. The destination names
# that folder (public/), never a bare `host:`, which without the lock would be
# the home directory. The host key is pinned (SITE_KNOWN_HOSTS), never learned
# on first contact. Where it deploys (SITE_DEPLOY_TARGET, `user@host`) and the
# SSH port (SITE_SSH_PORT) are secrets too, so forks and readers never see them.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/lib/styles/colors.css'
      - 'src/lib/server/update-manifest.ts'
      - 'ops/release/README.txt'
      - 'ops/release/versions.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: yarn

      # No install scripts: the site needs no native module, and `prepare`
      # wants the sibling kotoba checkout (`link:../kotoba`), which yarn
      # leaves as a dangling link here. The site never imports it.
      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        run: node --experimental-strip-types --test site/test/*.test.ts

      - name: Build
        run: yarn run site

      - name: Deploy
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
          SITE_DEPLOY_TARGET: ${{ secrets.SITE_DEPLOY_TARGET }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site
          chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete-delay --delay-updates --checksum \
            -e "ssh -p $SITE_SSH_PORT -i ~/.ssh/site -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            site/build/ "$SITE_DEPLOY_TARGET:public/"
          rm -f ~/.ssh/site
