# Builds tsundoku's website and puts it on the VPS (doc/WEBSITE.md, "Deploy").
#
# Runs on a push to main that touches what the page is made of, and on
# dispatch: ops/release/publish.ts dispatches it after a release, so the
# download block shows the new version within minutes. The build reads the
# live latest.json and stops if its signature doesn't verify.
#
# The deploy key is locked on the VPS (authorized_keys, `restrict` and
# `command="rrsync ..."`) to writing the one folder Caddy serves at
# tsundoku.masshiro.pro (~/sites/tsundoku, write-only): it can't open a shell,
# read, or reach anything else. That is why the destination has no path. SSH
# on the VPS listens on 8443, and the host key is pinned (SITE_KNOWN_HOSTS
# holds the `[vps.example]:8443 ssh-ed25519 ...` line), never learned on
# first contact.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/lib/styles/colors.css'
      - 'src/lib/server/update-manifest.ts'
      - 'ops/release/README.txt'
      - 'ops/release/versions.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: yarn

      # No install scripts: the site needs no native module, and `prepare`
      # wants the sibling kotoba checkout (`link:../kotoba`), which yarn
      # leaves as a dangling link here. The site never imports it.
      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        run: node --experimental-strip-types --test site/test/*.test.ts

      - name: Build
        run: yarn run site

      - name: Deploy
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site
          chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete-delay --delay-updates --checksum \
            -e 'ssh -p 8443 -i ~/.ssh/site -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts' \
            site/build/ masshiro@vps.example:
          rm -f ~/.ssh/site
