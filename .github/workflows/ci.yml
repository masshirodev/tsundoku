# The checks every change to main passes, run where anyone can see them:
# typecheck, lint and the unit suite for the app, the tray's Go tests and the
# Android apps' unit tests. The Playwright suite stays local (doc/TESTING.md):
# it needs the browsers, an engine and minutes a free runner doesn't have.
#
# While the repository is private, Actions minutes are paid, so pushes and pull
# requests run it only once it is public; a dispatch runs it either way.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # package.json links kotoba as ../kotoba, so the two check out side by side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tsundoku
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masshirodev/kotoba
          path: kotoba

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      # The fingerprint specs need chromaprint's fpcalc and ffmpeg; without
      # them they skip, and a green run would test less than a local one.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      # kotoba resolves its own imports from its own node_modules.
      - run: yarn install --frozen-lockfile
        working-directory: kotoba
      - run: yarn install --frozen-lockfile
        working-directory: tsundoku

      - run: yarn run check
        working-directory: tsundoku
      - run: yarn run lint
        working-directory: tsundoku
      - run: yarn run test
        working-directory: tsundoku

  tray:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/release/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ops/release/tray/go.mod
          cache-dependency-path: ops/release/tray/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  android:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon testTvDebugUnitTest testMobileDebugUnitTest
